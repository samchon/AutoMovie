name: test
on:
  pull_request:
    paths:
      # BOTH workflow definitions, in both files. The suite reads and asserts
      # on these two YAMLs (`test_workspace_ci_triggers`), so each is an input
      # to the job that runs the suite, not only to the job it defines: a pull
      # request editing build.yml alone must still run this suite, and one
      # editing this file alone must still build (#1397).
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
      - '.github/license-policy.json'
      # Matched by SHAPE, mirroring build.yml. The suite reads more than `src`:
      # the per-package lint ruleset `ttsc` enforces before a scenario runs, the
      # generators whose output it asserts, the guide corpus `prepare` bakes
      # into a pinned constant, and the scaffold `test_cli_scaffold` reads from
      # disk. None of those triggered a run before (#1333).
      - 'packages/*/src/**'
      - 'packages/*/*.json'
      - 'packages/*/*.ts'
      - 'packages/*/*.cts'
      - 'packages/*/*.cjs'
      - 'packages/*/*.html'
      # A package's own entry document. `test_workspace_public_contracts`
      # reads three of them and asserts on their text, so they are suite
      # inputs the same way `src` is (#1397).
      - 'packages/*/*.md'
      - 'packages/*/build/**'
      - 'packages/*/native/**'
      - 'packages/*/go.mod'
      - 'packages/*/go.sum'
      - 'packages/*/prompts/**'
      - 'packages/*/scaffold/**'
      - 'packages/*/scripts/**'
      - 'internals/config/**'
      - 'internals/*.mjs'
      - 'test/**'
      # Root tooling configuration, by shape (#1335). This list is deliberately
      # identical to build.yml's, now with no exception at all, since #1397
      # put both workflow filenames in both files. The two have drifted once
      # each, and keeping them identical is what makes the next drift visible
      # in review; `test_workspace_ci_triggers` now fails on it outright.
      # GitHub cannot share a `paths:` block between workflow files, so the
      # alternative is one workflow with two jobs, which would rename both
      # required checks; not worth doing while a rename cannot be confirmed
      # without merging it.
      - '*.js'
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '.prettier*'
      - '.gitattributes'
      # The root entry document, read by `test_workspace_public_contracts`
      # like the package ones above. Named rather than globbed as `*.md`
      # because `AGENTS.md` and `CLAUDE.md` are agent instructions no job
      # reads, and neither is `.gitignore`: none of the three belongs here.
      # #1386 and #1387 are the failure this line closes, and it is the
      # opposite one: a pull request whose whole diff was markdown, and
      # neither job ran at all.
      - 'README.md'
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      # The test program runs straight through ttsx (ttsc's tsgo runner, no
      # separate compile step). The coverage run executes every scenario and
      # fails if engine coverage drops below 100% on any metric.
      - name: Run Tests with 100% Coverage Gate
        run: pnpm coverage
        working-directory: test

      - name: Report Exact Coverage Gaps
        if: failure()
        run: node internals/report-coverage-gaps.mjs

  Windows:
    # NTFS supplies the case-insensitive path-identity half of the lint
    # contributor contract; Ubuntu retains the case-sensitive twin above.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      - name: Run Tests with 100% Coverage Gate
        run: pnpm coverage
        working-directory: test

      - name: Report Exact Coverage Gaps
        if: failure()
        run: node internals/report-coverage-gaps.mjs
