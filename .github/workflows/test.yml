name: test
on:
  pull_request:
    paths:
      # Keep both required checks present when either workflow contract
      # changes. A path-filtered required workflow can otherwise remain
      # pending instead of reporting a result for the pull request (#1397).
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
      - '.github/license-policy.json'
      # Matched by SHAPE, mirroring build.yml. The suite reads more than `src`:
      # the per-package lint ruleset `ttsc` enforces before a scenario runs, the
      # generators whose output it asserts, the guide corpus `prepare` bakes
      # into a pinned constant, and the scaffold `test_cli_scaffold` reads from
      # disk. None of those triggered a run before (#1333).
      - 'packages/*/src/**'
      - 'packages/*/*.json'
      - 'packages/*/*.ts'
      - 'packages/*/*.cts'
      - 'packages/*/*.cjs'
      - 'packages/*/*.html'
      # Package entry documents are part of the published package surface and
      # therefore travel through the packaged test boundary (#1397).
      - 'packages/*/*.md'
      - 'packages/*/build/**'
      - 'packages/*/prompts/**'
      - 'packages/*/scaffold/**'
      - 'packages/*/scripts/**'
      - 'internals/config/**'
      - 'internals/*.mjs'
      - 'test/**'
      # Root tooling configuration, by shape (#1335). This list is deliberately
      # identical to build.yml's, now with no exception at all, since #1397
      # put both workflow filenames in both files. Keeping the visible policy
      # symmetric makes a future drift reviewable.
      # GitHub cannot share a `paths:` block between workflow files, so the
      # alternative is one workflow with two jobs, which would rename both
      # required checks; not worth doing while a rename cannot be confirmed
      # without merging it.
      - '*.js'
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '.prettier*'
      - '.gitattributes'
      # The root public entry document is named rather than globbing all
      # Markdown because agent instructions are not test inputs. #1386 and
      # #1387 showed that a public-document-only change still needs a reported
      # check.
      - 'README.md'
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      # `@ttsc/lint` and typia ship source plugins that are Go programs the
      # toolchain builds
      # once per cache key, and a cold build costs minutes in every job. The
      # content-addressed plugin binaries are tens of megabytes, so they cache
      # cleanly while the Go build cache that produced them does not. Restore and
      # save are separate steps because a combined `actions/cache` skips its save
      # when the job fails, which would keep a red lane from ever warming.
      - name: Restore Toolchain Plugin Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      # The test program runs straight through ttsx (ttsc's tsgo runner, no
      # separate compile step). The run executes every scenario and fails on a
      # failing assertion. Coverage is measured and reported beside it, but does
      # not fail the job: the repository has never met the 100% threshold the
      # script used to enforce, so a permanently red job told nobody anything
      # and buried real regressions in the same colour.
      - name: Run Tests and Measure Coverage
        run: pnpm coverage
        working-directory: test

      # Always, not only on failure: the gaps are the record of what is left,
      # and they are worth reading on a green run.
      - name: Report Exact Coverage Gaps
        run: node internals/report-coverage-gaps.mjs

      - name: Save Toolchain Plugin Cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  Windows:
    # NTFS supplies the case-insensitive path-identity half of the lint
    # contributor contract; Ubuntu retains the case-sensitive twin above.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      # `@ttsc/lint` and typia ship source plugins that are Go programs the
      # toolchain builds
      # once per cache key, and a cold build costs minutes in every job. The
      # content-addressed plugin binaries are tens of megabytes, so they cache
      # cleanly while the Go build cache that produced them does not. Restore and
      # save are separate steps because a combined `actions/cache` skips its save
      # when the job fails, which would keep a red lane from ever warming.
      - name: Restore Toolchain Plugin Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      - name: Run Tests and Measure Coverage
        run: pnpm coverage
        working-directory: test

      - name: Report Exact Coverage Gaps
        run: node internals/report-coverage-gaps.mjs

      - name: Save Toolchain Plugin Cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
