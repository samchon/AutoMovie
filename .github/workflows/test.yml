name: test
on:
  pull_request:
    paths:
      # BOTH workflow definitions, in both files. The suite reads and asserts
      # on these two YAMLs (`test_workspace_ci_triggers`), so each is an input
      # to the job that runs the suite, not only to the job it defines: a pull
      # request editing build.yml alone must still run this suite, and one
      # editing this file alone must still build (#1397).
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
      - '.github/license-policy.json'
      # Matched by SHAPE, mirroring build.yml. The suite reads more than `src`:
      # the per-package lint ruleset `ttsc` enforces before a scenario runs, the
      # generators whose output it asserts, the guide corpus `prepare` bakes
      # into a pinned constant, and the scaffold `test_cli_scaffold` reads from
      # disk. None of those triggered a run before (#1333).
      - 'packages/*/src/**'
      - 'packages/*/*.json'
      - 'packages/*/*.ts'
      - 'packages/*/*.cts'
      - 'packages/*/*.cjs'
      - 'packages/*/*.html'
      # A package's own entry document. `test_workspace_public_contracts`
      # reads three of them and asserts on their text, so they are suite
      # inputs the same way `src` is (#1397).
      - 'packages/*/*.md'
      - 'packages/*/build/**'
      - 'packages/*/prompts/**'
      - 'packages/*/scaffold/**'
      - 'packages/*/scripts/**'
      # Shared compiler/lint policy is a direct test input.
      - 'config/**'
      - 'internals/*.mjs'
      - 'test/**'
      # Root tooling configuration directly affects test installation and
      # execution (#1335).
      - '*.js'
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '.prettier*'
      - '.gitattributes'
      # The root entry document, read by `test_workspace_public_contracts`
      # like the package ones above. Named rather than globbed as `*.md`
      # because `AGENTS.md` and `CLAUDE.md` are agent instructions no job
      # reads, and neither is `.gitignore`: none of the three belongs here.
      # #1386 and #1387 are the failure this line closes, and it is the
      # opposite one: a pull request whose whole diff was markdown, and
      # neither job ran at all.
      - 'README.md'
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      # `@ttsc/lint` and typia ship source plugins that are Go programs the
      # toolchain builds
      # once per cache key, and a cold build costs minutes in every job. The
      # content-addressed plugin binaries are tens of megabytes, so they cache
      # cleanly while the Go build cache that produced them does not. Restore and
      # save are separate steps because a combined `actions/cache` skips its save
      # when the job fails, which would keep a red lane from ever warming.
      - name: Restore Toolchain Plugin Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      # The test program runs straight through ttsx (ttsc's tsgo runner, no
      # separate compile step). The run executes every scenario and fails on a
      # failing assertion. Coverage is measured and reported beside it, but does
      # not fail the job: the repository has never met the 100% threshold the
      # script used to enforce, so a permanently red job told nobody anything
      # and buried real regressions in the same colour.
      - name: Run Tests and Measure Coverage
        run: pnpm coverage
        working-directory: test

      # Always, not only on failure: the gaps are the record of what is left,
      # and they are worth reading on a green run.
      - name: Report Exact Coverage Gaps
        run: node internals/report-coverage-gaps.mjs

      - name: Save Toolchain Plugin Cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  Windows:
    # NTFS supplies the case-insensitive path-identity half of the lint
    # contributor contract; Ubuntu retains the case-sensitive twin above.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      # `@ttsc/lint` and typia ship source plugins that are Go programs the
      # toolchain builds
      # once per cache key, and a cold build costs minutes in every job. The
      # content-addressed plugin binaries are tens of megabytes, so they cache
      # cleanly while the Go build cache that produced them does not. Restore and
      # save are separate steps because a combined `actions/cache` skips its save
      # when the job fails, which would keep a red lane from ever warming.
      - name: Restore Toolchain Plugin Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      - name: Run Tests and Measure Coverage
        run: pnpm coverage
        working-directory: test

      - name: Report Exact Coverage Gaps
        run: node internals/report-coverage-gaps.mjs

      - name: Save Toolchain Plugin Cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
