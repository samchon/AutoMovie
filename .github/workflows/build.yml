name: build
on:
  pull_request:
    paths:
      # BOTH workflow definitions, in both files. The suite reads and asserts
      # on these two YAMLs (`test_workspace_ci_triggers`), so each is an input
      # to the job that runs the suite, not only to the job it defines: a pull
      # request editing test.yml alone must still build, and one editing this
      # file alone must still run the suite that reads it (#1397).
      - '.github/workflows/build.yml'
      - '.github/workflows/test.yml'
      - '.github/license-policy.json'
      # Every build input a package can carry, by SHAPE rather than by name.
      # The previous list named `src`, `package.json`, and `tsconfig.json`, and
      # each input added afterwards (per-package lint rules, code generators,
      # the guide corpus, the CLI scaffold, playground scripts and entry points)
      # fell outside it, so a change to any of them ran no job at all (#1333).
      # Enumerating today's files is what drifted, so these match the shape.
      - 'packages/*/src/**'
      - 'packages/*/*.json'
      - 'packages/*/*.ts'
      - 'packages/*/*.html'
      # A package's own entry document. `test_workspace_public_contracts`
      # reads three of them and asserts on their text, so they are suite
      # inputs the same way `src` is (#1397).
      - 'packages/*/*.md'
      - 'packages/*/build/**'
      - 'packages/*/native/**'
      - 'packages/*/go.mod'
      - 'packages/*/go.sum'
      - 'packages/*/prompts/**'
      - 'packages/*/scaffold/**'
      - 'packages/*/scripts/**'
      - 'internals/config/**'
      - 'internals/*.mjs'
      - 'test/**'
      # Root tooling configuration, by shape for the same reason (#1335). The
      # root half was outside the enumeration #1333 re-derived, so a pull
      # request touching only `prettier.config.js`, `.prettierignore` or
      # `.gitattributes` ran neither workflow. All three are read by the steps
      # below: the first two decide what `format:check` checks and how, and
      # `.gitattributes` normalizes the line endings of the tree this job
      # checks out, which `test_cli_scaffold` then asserts on.
      #
      # A leading `*` is kept off the dotfiles on purpose: `.gitignore` is not
      # a build input, so it stays unmatched rather than triggering both jobs.
      - '*.js'
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '.prettier*'
      - '.gitattributes'
      # The root entry document, read by `test_workspace_public_contracts`
      # like the package ones above. Named rather than globbed as `*.md` for
      # the same reason `.gitignore` is left out above: `AGENTS.md` and
      # `CLAUDE.md` are agent instructions no job reads, and a pull request
      # carrying only those two should still run nothing. What must not happen
      # is the reverse, which is what #1386 and #1387 did: a whole diff of
      # markdown, and neither job ran at all.
      - 'README.md'
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Dependencies
        run: pnpm install

      - name: Check Production Dependency Licenses
        run: pnpm run license:check

      # Formatting drifts silently without a gate: three separate topics in one
      # session each found the same three files unformatted on master and each
      # had to revert the churn to keep its diff on topic.
      - name: Check Formatting
        run: pnpm run format:check

      - name: Build Packages
        run: pnpm run build

      # The capture runtime belongs to the published starter, not this
      # checkout. Pack/install the real tarballs, explicitly provision the
      # pinned Chromium, run its WebGL/PNG doctor, then exercise preview/render.
      - name: Verify Packaged Capture and Production Flow
        run: pnpm run e2e:tgz
