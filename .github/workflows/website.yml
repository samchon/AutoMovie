name: website

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/website.yml"
      - "config/**"
      - "packages/engine/**"
      - "packages/interface/**"
      - "packages/viewer/**"
      # The manor page bundles this production's authored source and textures,
      # so a change to the house republishes the site without touching website/.
      - "experimental/medieval-baron-manor/**"
      - "website/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "config/**"
      - "packages/engine/**"
      - "packages/interface/**"
      - "packages/viewer/**"
      - "experimental/medieval-baron-manor/**"
      - "website/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Vite bundles the viewer, the engine, and the manor straight from their
      # workspace sources, so no package build precedes the site build.
      - name: Build website
        run: pnpm --filter @automovie/website build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: website/dist
          # keep gh-pages at one commit; full-history snapshots of a 20 MB
          # texture set would bloat the repository
          single-commit: true
