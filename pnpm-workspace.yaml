packages:
  - config
  - docs
  - packages/*
  - test
  # The finished manor production is a committed workspace member so the website
  # imports its authored source and textures; a disposable sandbox is not one.
  - experimental/medieval-baron-manor
  - website

overrides:
  "@huggingface/transformers>sharp": "file:packages/template/scaffold/vendor/sharp-disabled"

catalogs:
  samchon:
    typia: &typia ^13.2.0
    "@nestia/e2e": ^12.1.0
  typescript:
    ttsc: &ttsc ^0.29.0
    "@ttsc/evidence": *ttsc
    "@ttsc/lint": *ttsc
    typescript: ^7.0.2
    "@trivago/prettier-plugin-sort-imports": ^5.2.2
    prettier: ^3.5.3
  three:
    three: &three ^0.169.0
    "@types/three": *three
  gltf:
    "@gltf-transform/core": ^4.5.0
    "@gltf-transform/extensions": ^4.5.0
  vite:
    vite: ^5.4.10
    esbuild: ^0.21.5
  media:
    "@huggingface/transformers": ^3.8.1
    gifenc: ^1.0.3
    h264-mp4-encoder: ^1.0.12
    kokoro-js: ^1.2.1
    libopus-wasm: ^0.2.0
    mp4box: ^2.4.1
    onnxruntime-node: 1.21.0
    playwright: ^1.60.0
    playwright-core: ^1.60.0
    pngjs: ^7.0.0
    "@types/pngjs": ^6.0.5
  utils:
    "@types/node": ^22.19.17
    c8: ^10.1.3
    chalk: 4.1.2
    rimraf: ^6.0.1
  reference:
    "@modelcontextprotocol/sdk": ^1.30.0
    "@types/mdast": ^4.0.4
    htmlparser2: ^12.0.0
    mdast-util-from-markdown: ^2.0.3
    smol-toml: ^1.8.0
    zod: ^4.5.4
useNodeVersion: 22.15.0

onlyBuiltDependencies:
  - esbuild
