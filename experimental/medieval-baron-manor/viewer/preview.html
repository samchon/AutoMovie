<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>AutoMovie source preview</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #202020;
      }
      #view {
        display: block;
        visibility: hidden;
        width: 100%;
        height: 100%;
      }
      #notice,
      #keys,
      #status {
        position: fixed;
        color: #e8edf2;
        font: 12px/1.45 monospace;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }
      #notice {
        left: 16px;
        right: 340px;
        top: 14px;
        color: #ffd479;
        max-width: 42em;
      }
      #keys {
        right: 16px;
        top: 14px;
        text-align: right;
      }
      #status {
        left: 16px;
        bottom: 14px;
        max-width: 90vw;
        white-space: pre-wrap;
      }
      #preview-navigation {
        position: fixed;
        top: 108px;
        right: 16px;
        z-index: 2;
        box-sizing: border-box;
        width: 320px;
        max-width: calc(100vw - 32px);
        max-height: calc(100dvh - 196px);
        overflow: auto;
        padding: 12px;
        border: 1px solid #52616f;
        border-radius: 6px;
        background: #202830f2;
        color: #e8edf2;
        font: 13px/1.45 sans-serif;
        color-scheme: dark;
      }
      .preview-navigation-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #preview-navigation label {
        display: block;
        margin-top: 12px;
      }
      #preview-navigation input,
      #preview-navigation select {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
      }
      #preview-navigation input,
      #preview-navigation select,
      #preview-navigation button {
        min-height: 32px;
        padding: 4px 8px;
        border: 1px solid #71808e;
        border-radius: 4px;
        background: #293540;
        color: inherit;
        font: inherit;
      }
      #preview-navigation button {
        cursor: pointer;
      }
      #preview-navigation button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #preview-navigation-content > button,
      .preview-navigation-count {
        margin-top: 10px;
      }
      @media (max-width: 640px) {
        #notice {
          right: 16px;
        }
        #keys {
          left: 16px;
          top: 88px;
          text-align: left;
        }
        #preview-navigation {
          top: 180px;
          max-height: calc(100dvh - 268px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="notice">
      SOURCE PREVIEW. Working source checked and emitted by ttsc. Production
      admission is separate. Not review or delivery evidence.
    </div>
    <div id="keys">
      Click: mouse look · Esc: release<br />W A S D / arrows: fly · Space /
      C: rise / descend<br />Q / E: slower / faster · Shift: fast<br />Wheel:
      field of view
    </div>
    <div id="status">Loading current source...</div>
    <script type="module" src="/viewer/src/sourcePreviewClient.js"></script>
  </body>
</html>
